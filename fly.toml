# fly.toml app configuration file generated for plataforma-resumos on 2026-07-05T21:50:31-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'plataforma-resumos'
primary_region = 'gru'
console_command = '/app/manage.py shell'

[build]


[env]
  DATABASE_URL = 'sqlite:////app/data/db.sqlite3'
  PORT = '8000'

[[mounts]]
  source = 'dados'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = '/app/static'
  url_prefix = '/static/'
